# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml
kind: hosted
name: contract-agent
# This bounded application exposes only the app-triggered Responses protocol.
protocols:
  - protocol: responses
    version: 2.0.0
resources:
  cpu: '1'
  memory: '2Gi'
environment_variables:
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
  - name: FOUNDRY_PROJECT_ENDPOINT
    value: ${FOUNDRY_PROJECT_ENDPOINT}
  - name: WAYPOINT_GATEWAY_BASE_URL
    value: ${WAYPOINT_GATEWAY_BASE_URL}
  - name: WAYPOINT_GATEWAY_SCOPE
    value: ${WAYPOINT_GATEWAY_SCOPE}
  - name: WAYPOINT_API_BASE_URL
    value: ${WAYPOINT_API_BASE_URL}
  - name: WAYPOINT_API_SCOPE
    value: ${WAYPOINT_API_SCOPE}
  - name: WAYPOINT_KB_TOOL_NAME
    value: ${WAYPOINT_KB_TOOL_NAME}
  - name: WAYPOINT_KB_MCP_ENDPOINT
    value: ${WAYPOINT_KB_MCP_ENDPOINT}
  - name: WAYPOINT_FOUNDRYIQ_RETRIEVAL_MODE
    value: minimal-extractive
  - name: WAYPOINT_FOUNDRYIQ_GATEWAY_VERIFIED
    value: ${WAYPOINT_FOUNDRYIQ_GATEWAY_VERIFIED}
  - name: TOOLBOX_NAME
    value: contract-toolbox
  # Investigative toolbox lane (FoundryIQ contract/policy KB); see azure.yaml.
  - name: TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT
    value: ${TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT}
