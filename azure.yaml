# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# MODIFY mode: native Agent Landing Zone owns foundation provision and deployment.
# apphost.cs remains the upstream local-development orchestrator; do not provision it.
name: caldova-waypoint
services:
  web:
    project: ./apps/waypoint/web
    host: containerapp
    language: docker
    docker:
      path: Dockerfile
      context: .
  api:
    project: ./apps/waypoint/api
    host: containerapp
    language: docker
    docker:
      path: Dockerfile
      context: .
  contract-agent:
    project: ./modules/agents/contract-agent
    host: azure.ai.agent
    language: docker
    kind: hosted
    name: contract-agent
    description: Private invoice investigation with gateway-only model access.
    startupCommand: uv run --frozen --no-sync python main.py
    docker:
      remoteBuild: true
    container:
      resources:
        cpu: "1"
        memory: "2Gi"
    protocols:
      - protocol: responses
        version: "2.0.0"
    env:
      FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      WAYPOINT_GATEWAY_BASE_URL: ${WAYPOINT_GATEWAY_BASE_URL}
      WAYPOINT_GATEWAY_SCOPE: ${WAYPOINT_GATEWAY_SCOPE}
      WAYPOINT_API_BASE_URL: ${WAYPOINT_API_BASE_URL}
      WAYPOINT_API_SCOPE: ${WAYPOINT_API_SCOPE}
      TOOLBOX_NAME: contract-toolbox
      TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT: ${TOOLBOX_CONTRACT_TOOLBOX_MCP_ENDPOINT}
      WAYPOINT_KB_TOOL_NAME: ${WAYPOINT_KB_TOOL_NAME}
      WAYPOINT_KB_MCP_ENDPOINT: ${WAYPOINT_KB_MCP_ENDPOINT}
      WAYPOINT_FOUNDRYIQ_RETRIEVAL_MODE: minimal-extractive
      WAYPOINT_FOUNDRYIQ_GATEWAY_VERIFIED: ${WAYPOINT_FOUNDRYIQ_GATEWAY_VERIFIED}
      MODEL_REASONING_EFFORT: low
      OTEL_EXPERIMENTAL_RESOURCE_DETECTORS: ""
      APPLICATIONINSIGHTS_STATSBEAT_DISABLED_ALL: "true"
requiredVersions:
  azd: ">=1.31.2"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.13"
